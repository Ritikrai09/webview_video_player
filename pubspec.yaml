name: webviewtube
description: Play YouTube videos on mobile platforms, using WebView and IFrame Player API.
version: 3.0.1
repository: https://github.com/yh-luo/webviewtube

environment:
  sdk: ">=2.17.0 <4.0.0"
  flutter: ">=3.16.6"

platforms:
  android:
  ios:

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.5
  webview_flutter: ^4.13.0
  webview_flutter_android: ^4.10.1
  webview_flutter_wkwebview: ^3.23.0

dev_dependencies:
  build_runner: ^2.7.0
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
  mockito: ^5.5.0
  webview_flutter_platform_interface: ^2.14.0
